name: Deploy playable demo

# 仓库只提交源码：dist/ 是 Vite 构建产物（.gitignore 忽略），
# 由本工作流在每次 push 到 main 时重新构建并发布到 GitHub Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，且不取消进行中的部署（避免站点短暂空档）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # 防非确定性构建 + 防「源码改了产物没重建」：
      # 产物由 .gitignore 忽略、本就不入库，因此 git diff --exit-code 只检查被跟踪文件。
      - name: Build reproducibility & tracked-files guard
        run: |
          sha256sum dist/index.html dist/assets/*.js > /tmp/h1
          npm run build
          sha256sum dist/index.html dist/assets/*.js > /tmp/h2
          diff -u /tmp/h1 /tmp/h2
          git diff --exit-code

      - name: Assemble static site
        run: |
          mkdir -p site
          cp -R dist/. site/
          touch site/.nojekyll
          printf 'Playable build of commit %s\n' "$GITHUB_SHA" > site/build.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
